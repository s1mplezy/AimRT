aimrt:
  plugin:
    plugins:
      - name: ros2_plugin
        path: ./libaimrt_ros2_plugin.so
        options:
          node_name: example_ros2_loaned_channel_subscriber
          executor_type: SingleThreaded
  log:
    core_lvl: INFO
    backends:
      - type: console
  channel:
    backends:
      - type: ros2
    sub_topics_options:
      - topic_name: "^loaned_topic$"
        enable_backends: [ros2]
  module:
    pkgs:
      - path: ./libros2_chn_pkg.so
        enable_modules: [LoanedSubscriberModule]
    modules:
      - name: LoanedSubscriberModule
        log_lvl: INFO

LoanedSubscriberModule:
  topic_name: loaned_topic
