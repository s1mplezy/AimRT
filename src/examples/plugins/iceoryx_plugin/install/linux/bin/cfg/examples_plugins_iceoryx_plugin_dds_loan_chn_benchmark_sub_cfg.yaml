aimrt:
  plugin:
    plugins:
      - name: iceoryx_plugin
        path: ./libaimrt_iceoryx_plugin.so
        options:
          shm_init_size: 2048
  log:
    core_lvl: INFO
    backends:
      - type: console
  executor: null
  channel:
    backends:
      - type: iceoryx
    sub_topics_options:
      - topic_name: (.*)
        enable_backends: [iceoryx]
  module:
    pkgs:
      - path: ./libdds_chn_sub_pkg.so
        enable_modules: [LoanedBenchmarkSubscriberModule]
    modules:
      - name: LoanedBenchmarkSubscriberModule
        log_lvl: INFO

LoanedBenchmarkSubscriberModule:
  max_topic_number: 10
  loan_message_size: ${MSG_SIZE}
